<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" fill="none" className="w-auto h-full">
  <g transform="translate(10, 10)">
    <!-- Circular Emblem -->
    <circle cx="55" cy="55" r="48" stroke="#ffffff" stroke-width="8" fill="none" />
    
    <!-- Stylized Monogram LL / Linkers Glyph -->
    <path 
      d="M36 78 L53 38 C54.5 34.5 58 34.5 59.5 38 L65 52 L56 72 L42 72 L42 78 L74 78 C76 78 77.5 76 76.5 74 L69 58 L78 38 C79.5 34.5 83 34.5 84.5 38 L94 78" 
      stroke="#ffffff" 
      stroke-width="7" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none"
    />
    <path 
      d="M40 70 L48 70 L62 38 C63 35.5 66 35.5 67 38 L74 54" 
      stroke="#ffffff" 
      stroke-width="6" 
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>

  <!-- Wordmark: LOADLINKERS -->
  <text 
    x="135" 
    y="66" 
    fill="#ffffff" 
    font-family="Figtree, var(--font-figtree), system-ui, -apple-system, sans-serif" 
    font-weight="900" 
    font-size="44" 
    letter-spacing="2.5"
  >
    LOADLINKERS
