  <!-- Subtitle: TRANSPORTATION MANAGEMENT SYSTEM -->
  <text 
    x="137" 
    y="96" 
    fill="#ffffff" 
    font-family="Figtree, var(--font-figtree), system-ui, -apple-system, sans-serif" 
    font-weight="700" 
